services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: commutecircle
      POSTGRES_DB: commutecircle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commutecircle -d commutecircle"]
      interval: 5s
      retries: 10
  migrate:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://commutecircle:${POSTGRES_PASSWORD}@db:5432/commutecircle
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://commutecircle:${POSTGRES_PASSWORD}@db:5432/commutecircle
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  pgdata:
