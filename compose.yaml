services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: commutecircle
      POSTGRES_DB: commutecircle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commutecircle -d commutecircle"]
      interval: 5s
      retries: 10
  migrate:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://commutecircle:${POSTGRES_PASSWORD}@db:5432/commutecircle
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://commutecircle:${POSTGRES_PASSWORD}@db:5432/commutecircle
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      DOCS_OAUTH_CLIENT_ID: ${DOCS_OAUTH_CLIENT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_SERVICE_SID: ${TWILIO_SMS_SERVICE_SID:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_WHATSAPP_CONTENT_SID: ${TWILIO_WHATSAPP_CONTENT_SID:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  pgdata:
