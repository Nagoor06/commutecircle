name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    name: API checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: commutecircle_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d commutecircle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/commutecircle_test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/commutecircle_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - name: Validate migrations on disposable PostgreSQL
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - name: Validate browser modules and package the Pages release
        run: |
          find app/studio/app -name '*.js' -print0 | xargs -0 -n 1 node --check
          python ../../scripts/package_web.py --out "$RUNNER_TEMP/cc-pages"
      - name: Test mobile and desktop identity, booking and refund flows
        working-directory: .
        env:
          CC_BROWSER_IDENTITIES: ${{ runner.temp }}/cc-browser-identities.json
        run: |
          npm ci --prefix qa/browser --ignore-scripts --no-audit --no-fund
          (cd services/api && PYTHONPATH=. python ../../qa/browser/server.py) > "$RUNNER_TEMP/cc-browser-server.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/health/ready >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/health/ready
          npm test --prefix qa/browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-browser-checks
          path: qa/browser/evidence/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commutecircle-pages
          path: ${{ runner.temp }}/cc-pages/
      - name: Verify runtime container builds
        run: docker build -t commutecircle-api:test .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage
          path: services/api/coverage.xml
  image:
    name: Publish tested image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and publish immutable commit tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/api"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$GITHUB_SHA" services/api
          docker push "$IMAGE:$GITHUB_SHA"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          printf 'Image for promotion: `%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
