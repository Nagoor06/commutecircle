name: Temporary V2 source autoformat
on:
  push:
    branches: [feat/commutecircle-v2-mvp]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply pinned Ruff formatting and safe lint fixes
        run: |
          pip install --require-hashes -r services/api/requirements-dev.txt
          cd services/api
          ruff check --fix .
          ruff format .
      - name: Commit formatted source
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/api
            git commit -m "style(v2): format and sort Python imports"
            git push origin HEAD:refs/heads/feat/commutecircle-v2-mvp
          fi
