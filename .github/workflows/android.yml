name: Android
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '8.13'
      - name: Build and lint Android app
        working-directory: apps/mobile
        run: gradle --no-daemon lint assembleDebug bundleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: commutecircle-android
          path: |
            apps/mobile/app/build/outputs/apk/debug/*.apk
            apps/mobile/app/build/outputs/bundle/release/*.aab
            apps/mobile/app/build/reports/lint-results*.html
          if-no-files-found: error
          retention-days: 30
