name: Android
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Android ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [preview, production]
    env:
      CI: '1'
      CC_MOBILE_VARIANT: ${{ matrix.variant }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Check native screens and session flows
        if: matrix.variant == 'preview'
        run: npm run typecheck && npm test
      - run: npm run prebuild:android
      - name: Build standalone preview APK
        if: matrix.variant == 'preview'
        env:
          NODE_ENV: production
        run: |
          ./android/gradlew -p android --max-workers=2 :app:assembleRelease
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/CommuteCircle-0.4.0-preview.apk
      - name: Build unsigned Google Play bundle
        if: matrix.variant == 'production'
        env:
          NODE_ENV: production
        run: |
          ./android/gradlew -p android --max-workers=2 :app:bundleRelease
          mkdir -p artifacts
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/CommuteCircle-0.4.0-unsigned.aab
          if unzip -Z1 artifacts/*.aab | grep -E '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then exit 1; fi
      - name: Enable emulator acceleration
        if: matrix.variant == 'preview'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise native launch offline, navigation and reopen
        if: matrix.variant == 'preview'
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: python3 scripts/android_smoke.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.variant == 'preview'
        with:
          name: native-startup-evidence
          path: apps/mobile/artifacts/startup/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: commutecircle-android-${{ matrix.variant }}
          path: |
            apps/mobile/artifacts/*.apk
            apps/mobile/artifacts/*.aab
          if-no-files-found: error
          retention-days: 30
